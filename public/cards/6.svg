<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#331624"/>
      <stop offset="1" stop-color="#1a0b12"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- bold diagonal accent field -->
  <g transform="">
    <path d="M0 675 L520 675 L820 0 L300 0 Z" fill="url(#band)"/>
    <path d="M540 675 L620 675 L900 0 L820 0 Z" fill="#fb7185" fill-opacity="0.25"/>
  </g>
  <!-- floodlight glow -->
  <circle cx="940" cy="200" r="430" fill="url(#glow)"/>
  <!-- stylised ball -->
  <circle cx="940" cy="230" r="66" fill="#0a1a10" fill-opacity="0.55" stroke="#fb7185" stroke-width="5"/>
  <circle cx="940" cy="184" r="15" fill="#fb7185" fill-opacity="0.5"/><circle cx="980" cy="207" r="15" fill="#fb7185" fill-opacity="0.5"/><circle cx="980" cy="253" r="15" fill="#fb7185" fill-opacity="0.5"/><circle cx="940" cy="276" r="15" fill="#fb7185" fill-opacity="0.5"/><circle cx="900" cy="253" r="15" fill="#fb7185" fill-opacity="0.5"/><circle cx="900" cy="207" r="15" fill="#fb7185" fill-opacity="0.5"/>
  <circle cx="940" cy="230" r="18" fill="#fb7185"/>
  <!-- motion streaks -->
  <g stroke="#fb7185" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round">
    <line x1="790" y1="180" x2="640" y2="150"/>
    <line x1="790" y1="230" x2="610" y2="230"/>
    <line x1="790" y1="280" x2="640" y2="310"/>
  </g>
  <!-- accent baseline -->
  <rect x="0" y="661" width="1200" height="14" fill="#fb7185"/>
</svg>